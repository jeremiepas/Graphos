# Graphos — Neo4j + Observability Development Stack
#
# Quick start:
#   docker compose up -d          # Start all services
#   docker compose up -d neo4j    # Start only Neo4j
#   docker compose down            # Stop (data preserved in volumes)
#   docker compose down -v         # Stop and delete data
#
# Access:
#   Neo4j Browser:  http://localhost:7474
#   Neo4j Bolt:     bolt://localhost:7687
#   Grafana:        http://localhost:13000 (anonymous access, no login)
#   Prometheus:     http://localhost:9091
#   OTel Collector: http://localhost:14318 (OTLP HTTP)
#
# Graphos integration:
#   graphos . --neo4j                          # Export Cypher to graphos-out/
#   graphos . --neo4j --neo4j-push http://localhost:7474  # Push directly
#   graphos . --otel --otel-endpoint http://localhost:14318  # Enable tracing
#   graphos . --metrics 9090                   # Expose Prometheus metrics

services:
  neo4j:
    image: neo4j:5-community
    container_name: graphos-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP — Neo4j Browser + REST API
      - "7687:7687"   # Bolt — Cypher query protocol
    environment:
      # ── Authentication ──────────────────────────────────────────
      # Format: username/password. Use "none" to disable auth (dev only).
      - NEO4J_AUTH=neo4j/graphos_dev

      # ── Memory (tuned for development) ─────────────────────────
      # Default heap/pagecache are only 512M each — too small for real use.
      # Heap: used for query execution, transaction state, caching.
      # Pagecache: used for mapping store files to memory.
      # Rule of thumb: heap + pagecache + 1GB < total container memory.
      - NEO4J_server_memory_heap_initial__size=256M
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M

      # ── Plugins ────────────────────────────────────────────────
      # APOC (Awesome Procedures on Cypher) — graph algorithms, path expansion,
      # utility functions. Required by many graph analysis workflows.
      - NEO4J_PLUGINS=["apoc","graph-data-science"]

      # ── Network ────────────────────────────────────────────────
      # Docker automatically maps ports. Advertised address uses the
      # container hostname so Bolt clients (Graphos, drivers) can connect.
      - NEO4J_server_bolt_advertised__address=localhost:7687
      - NEO4J_server_http_advertised__address=localhost:7474

      # ── Security (development) ─────────────────────────────────
      # Disable strict config validation so Neo4j doesn't fail on
      # unrecognized settings from plugin defaults. Safe for dev.
      # TLS is off by default in community edition without certificates.
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j-data:/data        # Graph database files (persistent)
      - neo4j-logs:/logs        # Debug and query logs
      - neo4j-plugins:/plugins  # APOC and custom plugins
      - neo4j-config:/config    # Neo4j configuration overrides
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphos_dev 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── OpenTelemetry Collector ────────────────────────────────────
  # Receives traces and metrics from Graphos via OTLP HTTP.
  # Forwards to Prometheus (metrics) and Loki (logs/traces).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: graphos-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "14318:4318"  # OTLP HTTP receiver (remapped, 4318 in use)
      - "14317:4317"  # OTLP gRPC receiver (remapped, 4317 in use)
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)
    depends_on:
      - prometheus
      - loki

  # ── Prometheus ─────────────────────────────────────────────────
  # Scrapes metrics from Graphos (--metrics 9090) and the OTel Collector.
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: graphos-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"

  # ── Loki ────────────────────────────────────────────────────────
  # Receives log and trace data from OTel Collector.
  loki:
    image: grafana/loki:2.9.6
    container_name: graphos-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  # ── Grafana ─────────────────────────────────────────────────────
  # Visualization dashboard for Prometheus metrics and Loki traces.
  grafana:
    image: grafana/grafana:10.4.1
    container_name: graphos-grafana
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/graphos-pipeline.json
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATE=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  neo4j-data:
    name: graphos-neo4j-data
  neo4j-logs:
    name: graphos-neo4j-logs
  neo4j-plugins:
    name: graphos-neo4j-plugins
  neo4j-config:
    name: graphos-neo4j-config
  prometheus-data:
    name: graphos-prometheus-data
  loki-data:
    name: graphos-loki-data
  grafana-data:
    name: graphos-grafana-data