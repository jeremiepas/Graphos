apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: runner-graphos-lsp-extract
  namespace: worker-github
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: runner-graphos-lsp-extract
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
