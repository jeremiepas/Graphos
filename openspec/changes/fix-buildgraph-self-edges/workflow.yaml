# Workflow for the OpenSpec change `fix-buildgraph-self-edges` (generated by
# scripts/gen-graphos-workflows.py). One delegate step per task group.

workflow: fix-buildgraph-self-edges
params: []

steps:
  - id: s1
    executor: delegate
    target: opencode-deepseek
    instruction: |-
      1. Filter self-edges in buildGraph — OpenSpec change `fix-buildgraph-self-edges` (openspec/changes/fix-buildgraph-self-edges/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 1.1 Add `edgeSource e /= edgeTarget e` to `buildGraph`'s `validEdges` filter in `src/Graphos/Domain/Graph/Core.hs`
      - 1.2 Update the `buildGraph` doc-comment to state that self-edges are dropped to keep `G_s` irreflexive (Phase 1 `SupportGraph`, `adj v v == False`; Lean seam `NoSelfLoops`)

  - id: s2
    executor: delegate
    target: opencode-deepseek
    depends_on: [s1]
    instruction: |-
      2. Regression tests — OpenSpec change `fix-buildgraph-self-edges` (openspec/changes/fix-buildgraph-self-edges/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 2.1 Lone self-edge: node preserved, `degree 0`, not its own neighbour (undirected `buildGraph False`)
      - 2.2 Self-edge coexisting with a real edge: the real edge is kept, the self-edge is dropped
      - 2.3 Self-edge dropped in directed mode (`buildGraph True`)

  - id: s3
    executor: delegate
    target: opencode-deepseek
    depends_on: [s2]
    instruction: |-
      3. Verify — OpenSpec change `fix-buildgraph-self-edges` (openspec/changes/fix-buildgraph-self-edges/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 3.1 `cabal build --flag dev` with `-Werror` is clean
      - 3.2 `cabal test` is green
      - 3.3 `openspec validate` passes the delta spec
