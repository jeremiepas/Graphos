# Workflow for the OpenSpec change `checkpoint-and-cluster-only-controls` (generated by
# scripts/gen-graphos-workflows.py). One delegate step per task group.

workflow: checkpoint-and-cluster-only-controls
params: []

steps:
  - id: s1
    executor: delegate
    target: opencode-deepseek
    instruction: |-
      1. CLI — OpenSpec change `checkpoint-and-cluster-only-controls` (openspec/changes/checkpoint-and-cluster-only-controls/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 1.1 Add `--fresh` / `--no-checkpoint` flag
      - 1.2 Ensure `--cluster-only` parses and is mutually sensible with `--fresh`

  - id: s2
    executor: delegate
    target: opencode-deepseek
    depends_on: [s1]
    instruction: |-
      2. Checkpoint decision — OpenSpec change `checkpoint-and-cluster-only-controls` (openspec/changes/checkpoint-and-cluster-only-controls/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 2.1 Centralize checkpoint discovery/selection logic
      - 2.2 Bypass discovery when `--fresh` is set
      - 2.3 Log `Resuming from checkpoint <path> (age ...)` vs `Full extraction` at INFO

  - id: s3
    executor: delegate
    target: opencode-deepseek
    depends_on: [s2]
    instruction: |-
      3. Genuine cluster-only — OpenSpec change `checkpoint-and-cluster-only-controls` (openspec/changes/checkpoint-and-cluster-only-controls/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 3.1 Load nodes+edges from checkpoint and enter pipeline at Cluster stage
      - 3.2 Skip Extract and Infer stages under `--cluster-only`
      - 3.3 Error clearly when `--cluster-only` has no usable checkpoint
      - 3.4 Minimal checkpoint provenance check; warn on input mismatch

  - id: s4
    executor: delegate
    target: opencode-deepseek
    depends_on: [s3]
    instruction: |-
      4. Verification — OpenSpec change `checkpoint-and-cluster-only-controls` (openspec/changes/checkpoint-and-cluster-only-controls/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 4.1 `cabal build --flag dev` with `-Werror`
      - 4.2 `cabal test` green (entry-point selection, flag behavior)
      - 4.3 Smoke: `--cluster-only` runs with no extraction logs; `--fresh` performs full extraction
