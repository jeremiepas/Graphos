# Workflow for the OpenSpec change `fix-resolution-semantics-docs` (generated by
# scripts/gen-graphos-workflows.py). One delegate step per task group.

workflow: fix-resolution-semantics-docs
params: []

steps:
  - id: s1
    executor: delegate
    target: opencode-deepseek
    instruction: |-
      1. Empirical verification — OpenSpec change `fix-resolution-semantics-docs` (openspec/changes/fix-resolution-semantics-docs/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 1.1 Run a `--cluster-only` resolution sweep (0.5 / 1.0 / 2.0) on a known large graph
      - 1.2 Record largest-community size per value; determine the true direction of effect

  - id: s2
    executor: delegate
    target: opencode-deepseek
    depends_on: [s1]
    instruction: |-
      2. Documentation — OpenSpec change `fix-resolution-semantics-docs` (openspec/changes/fix-resolution-semantics-docs/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 2.1 Correct the `--resolution` help text to match measured behavior
      - 2.2 Update README/workflow clustering section accordingly
      - 2.3 Add the dense-subgraph caveat referencing the community-size cap
      - 2.4 Reconcile with the accepted `community-detection` spec: its unimplemented

  - id: s3
    executor: delegate
    target: opencode-deepseek
    depends_on: [s2]
    instruction: |-
      3. Runtime echo — OpenSpec change `fix-resolution-semantics-docs` (openspec/changes/fix-resolution-semantics-docs/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 3.1 Log effective resolution at INFO before clustering

  - id: s4
    executor: delegate
    target: opencode-deepseek
    depends_on: [s3]
    instruction: |-
      4. Optional code correction — OpenSpec change `fix-resolution-semantics-docs` (openspec/changes/fix-resolution-semantics-docs/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 4.1 If the mapping is provably inverted relative to intent, fix the resGamma mapping
      - 4.2 Keep default (1.0) behavior stable; note any behavior change
      - 4.3 Tests: resolution mapping direction

  - id: s5
    executor: delegate
    target: opencode-deepseek
    depends_on: [s4]
    instruction: |-
      5. Verification — OpenSpec change `fix-resolution-semantics-docs` (openspec/changes/fix-resolution-semantics-docs/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 5.1 `cabal build --flag dev` with `-Werror`
      - 5.2 `cabal test` green
      - 5.3 Confirm help text and measured sweep agree
