# Workflow for the OpenSpec change `mcp-request-resilience` (generated by
# scripts/gen-graphos-workflows.py). One delegate step per task group.

workflow: mcp-request-resilience
params: []

steps:
  - id: s1
    executor: delegate
    target: opencode-deepseek
    instruction: |-
      1. Domain / Graph query — OpenSpec change `mcp-request-resilience` (openspec/changes/mcp-request-resilience/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 1.1 Add bounded neighborhood expansion helper (stop at N nodes, report omitted)
      - 1.2 Add bounded community-member enumeration
      - 1.3 QuickCheck: expansion never exceeds cap; omitted count correct

  - id: s2
    executor: delegate
    target: opencode-deepseek
    depends_on: [s1]
    instruction: |-
      2. UseCase / SelectContext — OpenSpec change `mcp-request-resilience` (openspec/changes/mcp-request-resilience/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 2.1 Honor a node budget during context selection expansion
      - 2.2 Return truncation metadata from selection

  - id: s3
    executor: delegate
    target: opencode-deepseek
    depends_on: [s2]
    instruction: |-
      3. Infrastructure / MCP server — OpenSpec change `mcp-request-resilience` (openspec/changes/mcp-request-resilience/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 3.1 Wrap each tool request in a configurable wall-clock timeout (STM/async)
      - 3.2 On timeout, harvest and return partial results with `truncated: true`
      - 3.3 Add `maxRequestNodes` and timeout params to `get_community`, `get_neighbors`, `select_context`
      - 3.4 Add `truncated` and `omitted` fields to affected tool responses

  - id: s4
    executor: delegate
    target: opencode-deepseek
    depends_on: [s3]
    instruction: |-
      4. Config & CLI — OpenSpec change `mcp-request-resilience` (openspec/changes/mcp-request-resilience/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 4.1 Add config `mcp.maxRequestNodes` and `mcp.requestTimeout`
      - 4.2 Document defaults in tool descriptions

  - id: s5
    executor: delegate
    target: opencode-deepseek
    depends_on: [s4]
    instruction: |-
      5. Verification — OpenSpec change `mcp-request-resilience` (openspec/changes/mcp-request-resilience/).
      Read proposal.md, design.md, specs/ and tasks.md first; make the
      code changes in this repo, run the build and tests, then commit.
      Tasks:
      - 5.1 `cabal build --flag dev` with `-Werror`
      - 5.2 `cabal test` green
      - 5.3 MCP smoke test on a mega-community graph: `get_community`/`get_neighbors`/`select_context` return bounded results, no `-32001`
