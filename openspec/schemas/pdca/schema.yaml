name: pdca
version: 1
description: >
  PDCA spec-driven workflow - proposal → specs → design → tasks, with
  Plan/Do/Check/Act phases embedded at the spec level and the task level.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      PDCA framing: end the proposal with a **PDCA Cycle** section that states the

      Plan (target/hypothesis and how success is measured), Do (the change),

      Check (how results are verified), and Act (how findings feed the next

      iteration). Treat every change as one PDCA cycle.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.


      PDCA at the spec level: treat each requirement as the **Plan** (the target

      behavior, stated with SHALL/MUST) and its scenarios as the **Check**

      (verifiable cases that confirm the behavior). Optionally add a short PDCA

      note under a requirement to capture Do (how it is realized) and Act (how

      deviations or learnings iterate the requirement). Do NOT replace the

      `### Requirement:` / `#### Scenario:` structure - PDCA is layered on top of

      it, never instead of it.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Verification Strategy (Check)**: How the implementation is validated
      against goals and specs - tests, metrics, acceptance gates, rollout checks.

      - **Iteration & Rollback (Act)**: What happens if Check fails - rollback
      steps, follow-up actions, and how learnings are standardized for the next
      PDCA cycle.

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses

      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      PDCA PER TASK (not per change): every task is its own complete PDCA

      micro-cycle. Instead of four change-wide phases, each task `## N. <task>`

      contains its own ordered sub-steps `N.P Plan`, `N.D Do`, `N.C Check`,

      `N.A Act`. A task is DONE only when its Check passes and its Act is OK.

      Everything else matches the classic spec-driven workflow (proposal → specs

      → design → tasks; artifact ordering; checkbox tracking; apply behavior).


      The cycle and the retry rule (a CONVENTION the agent follows — the CLI

      only tracks `- [ ]`/`- [x]` checkbox state, it does not enforce control

      flow):

      - **P (Plan)** - scope of THIS task, Check criteria (what proves success,

      defined before code), affected areas, risks. No code yet.

      - **D (Do)** - implement THIS task.

      - **C (Check)** - execute the Check criteria defined in Plan; run

      tests/quality gates; record result per criterion. MUST NOT invent new

      criteria. If a Plan criterion is unclear, record that finding — do not

      redefine to make things pass.

      - **A (Act)** - standardize what worked; address what Check surfaced.

      - **If Check passes AND Act is OK** → the task PASSES. Mark its steps `[x]`.
      The task then reaches the same DONE state it would have in the classic SDD
      workflow.

      - **If Act is NOT OK** → the task does NOT pass. Do not silently overwrite:
      KEEP THE TRACE of the failed attempt (record it under an
      `Attempt history` block on the task), then start a NEW P → D → C → A
      attempt for the same task (`N.P (attempt 2)`, `N.D (attempt 2)`, …).
      Repeat until an attempt passes. The task is DONE only when an attempt's
      Check passes and Act is OK.


      Guidelines:

      - Top-level `## N. <task>` headings are TASKS (one PDCA cycle each), not the
      four phases.

      - Within a task, sub-steps MUST be checkboxes: `- [ ] N.P …`, `- [ ] N.D …`,
      `- [ ] N.C …`, `- [ ] N.A …`.

      - Keep the trace of failed attempts; never delete a prior attempt's record.

      - Tasks should be small enough to complete in one session; order tasks by
      dependency.


      Example:

      ```

      ## 1. Implement data export

      - [ ] 1.P Plan: confirm CSV export acceptance criteria + affected modules

      - [ ] 1.D Do: implement export function + CSV formatting

      - [ ] 1.C Check: run tests/quality gates; validate the export spec scenario

      - [ ] 1.A Act: standardize/fix; if NOT OK, keep trace + start attempt 2

      ### Attempt history (1)
      <!-- Append a dated note per failed attempt; start a new N.P→N.A below. -->


      ## 2. Add import validation

      - [ ] 2.P Plan: …

      - [ ] 2.D Do: …

      - [ ] 2.C Check: …

      - [ ] 2.A Act: …

      ```


      Reference specs for what needs to be built, design for how to build it.

      Each task PASSES only when its Check is satisfied and its Act is OK.
    requires:
      - specs
      - design
  - id: plan
    generates: tasks/**/plan.md
    description: Per-task Plan (P) artifact, one folder per task
    template: pdca-step.md
    instruction: >
      Create one `tasks/<task-slug>/plan.md` per task listed in `tasks.md`.


      Use a kebab-case `<task-slug>` derived from the task heading (e.g.

      `## 1. Add OpenTelemetry dependencies` → `tasks/01-add-otel-dependencies/`).

      The per-task fan-out is a CONVENTION: the engine emits the glob path but

      cannot create one folder per task automatically — you create the folder

      and file for each task.


      `plan.md` is the **P** of this task's PDCA cycle: scope of THIS task,

      acceptance criteria (cite the spec scenario ids it satisfies), affected

      modules, prerequisites, and risks. No code yet. `tasks.md` remains the

      tracked index; this file is the detailed Plan journal for the task.


      **CRITICAL — Check criteria must be defined in Plan, not in Check.**

      To prevent confirmation bias, plan.md MUST include an explicit

      **Check Criteria** section that defines, before any code exists:

      - What specific tests/gates will be run (commands, test names)
      - What spec scenarios this task must satisfy (cite scenario ids)
      - What the exact PASS conditions are (expected outputs, exit codes, states)
      - What would constitute a FAIL (not just "doesn't work" — the boundary)
      Check.md MUST reference and execute these criteria, not invent new ones.
    requires:
      - tasks
  - id: do
    generates: tasks/**/do.md
    description: Per-task Do (D) artifact
    template: pdca-step.md
    instruction: >
      Create `tasks/<task-slug>/do.md` for each task — the **D** of the cycle:

      what was implemented for THIS task, key decisions, and the concrete

      changes made. Reference the matching `plan.md`. One per task folder.
    requires:
      - plan
  - id: check
    generates: tasks/**/check.md
    description: Per-task Check (C) artifact — the gate
    template: pdca-step.md
    instruction: >
      Create `tasks/<task-slug>/check.md` for each task — the **C** of the cycle:

      run tests/quality gates and validate the spec scenario(s) for THIS task;

      record PASS/FAIL with evidence (commands, outputs). Check is the gate: the

      task only proceeds to a passing Act when Check passes.


      **CRITICAL — Check must execute Plan's criteria, not invent its own.**

      Check.md MUST:

      - Reference the Check Criteria defined in plan.md (the exact criteria,

      not paraphrased)

      - Execute each criterion listed there and record the result

      - If a criterion from Plan is ambiguous or incomplete, record that as

      a finding — do NOT silently define a new criterion to make things pass

      - Evidence: exact commands run, their full output, exit codes

      - Verdict: PASS or FAIL per criterion, with no post-hoc redefinition
    requires:
      - do
  - id: act
    generates: tasks/**/act.md
    description: Per-task Act (A) artifact, with retry trace
    template: pdca-step.md
    instruction: >
      Create `tasks/<task-slug>/act.md` for each task — the **A** of the cycle.


      If Check passed and Act is OK → record the standardized outcome; the task

      PASSES (same done state as classic SDD) and its `tasks.md` steps are `[x]`.


      If Act is NOT OK → the task does NOT pass. KEEP THE TRACE: record the

      failed attempt here (or under `tasks/<task-slug>/attempt-N/` for a full new

      cycle), then start a NEW P → D → C → A attempt for the same task. Never

      delete a prior attempt's files. Repeat until an attempt passes.
    requires:
      - check
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, then work tasks ONE AT A TIME as full PDCA micro-cycles.
    For each task, run its steps in order: N.P Plan → N.D Do → N.C Check → N.A Act.
    - Mark each step `[x]` as you complete it.
    - A task PASSES only when its Check passes AND its Act is OK; then it reaches
      the same done state as in the classic spec-driven workflow.
    - If Act is NOT OK, the task does NOT pass: record the failed attempt under the
      task's "Attempt history" (keep the trace — never delete a prior attempt),
      then start a NEW P → D → C → A attempt for the same task and repeat until an
      attempt passes.
    Pause if you hit blockers or need clarification.
