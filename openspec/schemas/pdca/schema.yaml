name: pdca
version: 2
description: >
  PDCA spec-driven workflow - proposal → specs → design → tasks, with
  Plan/Do/Check/Act phases embedded at the spec level and the task level.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal: WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences. What problem? Why now?
      - **What Changes**: Bullet list. Mark **BREAKING** if applicable.
      - **Capabilities**: Critical — creates the contract with specs.
        - **New**: kebab-case names, each creates specs/<name>/spec.md.
        - **Modified**: existing specs whose REQUIREMENTS change. Check openspec/specs/.
      - **Impact**: Affected code, APIs, dependencies.
      - **PDCA Cycle**: Plan (target + success measure), Do (the change),
        Check (verification), Act (next iteration + standardization).

      Keep it concise (1-2 pages). Focus on why, not how.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create one spec file per capability in the proposal's Capabilities section.
      Each requirement MUST be a complete PDCA micro-cycle at the spec level.

      Paths:
      - New capabilities: use the exact kebab-case name from the proposal.
        Write to specs/<capability>/spec.md.
      - Modified capabilities: use the existing spec folder name from
        openspec/specs/<capability>/. Write the delta to specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities.
      - **MODIFIED Requirements**: Changed behavior — MUST include the full updated
        requirement block copied from the existing spec.
      - **REMOVED Requirements**: Deprecated features — MUST include **Reason**
        and **Migration**.
      - **RENAMED Requirements**: Name changes only — use FROM:/TO: format.

      Format rules:
      - Each requirement: `### Requirement: <name>` followed by SHALL/MUST text.
      - Each requirement MUST include a mandatory PDCA note (Plan target, Do approach,
        Check scenarios, Act feedback). Scenarios ARE the Check.
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN bullets.
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`).
      - Every requirement MUST have at least one scenario.
      - For MODIFIED, copy the entire original requirement block and edit it.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document: HOW to implement the change.
      Only create if the change is cross-cutting, has significant data/dependency
      changes, or needs technical decisions before coding.

      Sections:
      - **Context**: Background, current state, constraints.
      - **Goals / Non-Goals**: What is in scope and explicitly out.
      - **Decisions**: Key technical choices with alternatives and rationale.
      - **Risks / Trade-offs**: [Risk] → Mitigation.
      - **Verification Strategy (Check)**: Tests, metrics, gates.
      - **Iteration & Rollback (Act)**: What to do if Check fails.
      - **Migration Plan**: Deployment/rollback steps if applicable.
      - **Open Questions**: Decisions still to resolve.

      Reference the proposal for motivation and the specs for requirements.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list. The apply phase parses checkbox format; tasks not
      using `- [ ]` will not be tracked.

      PDCA PER TASK: each task is its own complete micro-cycle.
      Each `## N. <task>` has ordered sub-steps:
      - **P (Plan)**: Scope, check criteria (defined before code), affected areas, risks.
      - **D (Do)**: Implement this task.
      - **C (Check)**: Run the criteria from Plan; record PASS/FAIL per criterion.
        MUST NOT invent new criteria.
      - **A (Act)**: Standardize what worked. Feed learnings into the next task's Plan.
        If NOT OK, keep the trace and start a NEW P → D → C → A attempt
        (`N.P (attempt 2)`, `N.D (attempt 2)`, …).

      The cycle and retry rule are a CONVENTION the agent follows — the CLI only
      tracks `- [ ]`/`- [x]` checkbox state, it does not enforce control flow.
      A task is DONE only when its Check passes and its Act is OK.

      Guidelines:
      - Top-level `## N. <task>` headings are TASKS, not phases.
      - Sub-steps MUST be checkboxes: `- [ ] N.P …`, `- [ ] N.D …`, `- [ ] N.C …`, `- [ ] N.A …`.
      - Keep failed-attempt traces. Never delete a prior attempt.
      - Tasks should fit one session. Order by dependency.

      Reference specs for what to build and design for how to build it.
    requires:
      - specs
      - design
  - id: plan
    generates: tasks/**/plan.md
    description: Per-task Plan (P) artifact, one folder per task
    template: plan.md
    instruction: >
      Create one tasks/<task-slug>/plan.md per task in tasks.md.
      Derive the slug from the task heading, e.g.
      `## 1. Add OpenTelemetry dependencies` → tasks/01-add-otel-dependencies/.

      plan.md is the **P** of the task's PDCA cycle: scope, acceptance criteria
      (cite spec scenario ids), affected modules, prerequisites, and risks. No code.

      **CRITICAL — Check criteria must be defined in Plan, not in Check.**
      Include a **Check Criteria** section that defines, before code exists:
      - Tests/gates to run (commands, test names).
      - Spec scenarios this task must satisfy.
      - Exact PASS conditions (outputs, exit codes, states).
      - Exact FAIL boundary.

      If there is a previous task, read its act.md and carry any "Learnings / Next
      Steps" into this plan.
    requires:
      - tasks
  - id: do
    generates: tasks/**/do.md
    description: Per-task Do (D) artifact — implementation plan (created BEFORE code)
    template: do.md
    instruction: >
      Create tasks/<task-slug>/do.md — the **D** of the task's cycle.
      This is the IMPLEMENTATION PLAN, created BEFORE code.

      Structure:
      - Reference the matching plan.md for scope and criteria.
      - List concrete changes (files, functions, modules).
      - Describe key decisions and approach.

      After implementation, update do.md to reflect what was actually done,
      including any deviations from the plan. Keep the original intent visible.
    requires:
      - plan
  - id: check
    generates: tasks/**/check.md
    description: Per-task Check (C) artifact — verification plan and results
    template: check.md
    instruction: >
      Create tasks/<task-slug>/check.md — the **C** of the task's cycle.
      This file has TWO states:
      1. BEFORE implementation: the VERIFICATION PLAN, created alongside plan.md
         and do.md. It lists the exact commands, tests, and gates to run.
      2. AFTER implementation: the ACTUAL RESULTS appended to the plan. Commands run,
         outputs, exit codes, and PASS/FAIL verdicts with evidence.

      **CRITICAL — Check criteria MUST match plan.md exactly.**
      Copy each criterion from plan.md's "Check Criteria" section verbatim.
      Do not paraphrase, add, or remove criteria. If a criterion is unclear,
      record that finding — do not redefine it to make things pass.
      Keep the original verification plan visible after adding results.
    requires:
      - plan
  - id: act
    generates: tasks/**/act.md
    description: Per-task Act (A) artifact — final verdict trace (generated AFTER implementation+checking)
    template: act.md
    instruction: >
      Create tasks/<task-slug>/act.md — the **A** of the task's cycle.
      This is the FINAL VERDICT TRACE, generated AFTER implementation and checking.
      It summarizes the entire PDCA cycle and closes the loop.

      Structure:
      - **Outcome**: PASS or FAIL.
      - **Summary**: what was planned, done, checked, and the result.
      - **Learnings / Next Steps**:
        - If Check passed and Act is OK: record the standardized outcome;
          extract learnings to carry into the NEXT task's Plan.
        - If Act is NOT OK: record the failed attempt and start a NEW P→D→C→A
          attempt (keep all prior traces). Never delete a prior attempt.

      Mark tasks.md steps `[x]` only when both Check passed and Act is OK.
    requires:
      - check
      - do
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Context budget: read proposal + design once, then ONE task at a time.
    For each task, read only that task's plan.md, do.md, and check.md.
    Do NOT load all task files at once.

    PDCA flow per task:
    1. If there was a previous task, read its act.md "Learnings / Next Steps"
       and apply them to this task's plan.md.
    2. Create plan.md, do.md, and check.md together BEFORE any code.
       - plan.md: scope, check criteria, affected modules, risks.
       - do.md: implementation plan — what WILL be done.
       - check.md: verification plan — exact commands and expected results.
    3. IMPLEMENT the code changes following do.md.
    4. RUN checks from check.md against criteria from plan.md.
       Update check.md with actual results.
    5. Update do.md with deviations from the original plan.
    6. Generate act.md as the final verdict trace; include learnings for the next task.

    Mark each step `[x]` in tasks.md as you complete it.
    A task PASSES only when Check passes AND Act is OK.
    If Act is NOT OK: record the failed attempt, then start a new P→D→C→A cycle.
    Pause on blockers or unclear requirements.
