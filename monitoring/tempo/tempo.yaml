# Grafana Tempo — monolithic mode for local development
# Receives OTLP traces from the OTel Collector, stores locally with 14-day retention.
# Grafana queries this via the Tempo data source on port 4320.

stream_over_http_enabled: true

server:
  http_listen_port: 4320
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 336h  # 14 days

usage_report:
  reporting_enabled: false