# Prometheus configuration for Graphos observability stack
# Scrapes Graphos metrics endpoint + OTel Collector metrics + Tempo metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Graphos application metrics (--metrics 9190 to avoid port conflicts)
  - job_name: 'graphos'
    static_configs:
      - targets: ['172.27.0.1:9190']
        labels:
          service: 'graphos'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # OTel Collector self-reported metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector'
    scrape_interval: 15s

  # Tempo self-reported metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:4320']
        labels:
          service: 'tempo'
    scrape_interval: 15s
    metrics_path: /metrics