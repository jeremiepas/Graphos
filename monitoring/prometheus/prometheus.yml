# Prometheus configuration for Graphos observability stack
# Scrapes Graphos metrics endpoint + OTel Collector metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Graphos application metrics (--metrics 9090)
  - job_name: 'graphos'
    static_configs:
      - targets: ['host.docker.internal:9090']
        labels:
          service: 'graphos'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # OTel Collector self-reported metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector'
    scrape_interval: 15s