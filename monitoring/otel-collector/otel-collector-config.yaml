# OpenTelemetry Collector configuration for Graphos
# Receives OTLP HTTP traces/metrics/logs from Graphos, exports to:
#   - Prometheus (metrics)
#   - Tempo (traces)
#   - Loki (logs)

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Add service.name resource attribute to all signals
  transform/add_resource:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], "graphos") where attributes["service.name"] == nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], "graphos") where attributes["service.name"] == nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], "graphos") where attributes["service.name"] == nil

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 3600s

  # Tempo — trace backend for Grafana trace exploration
  otlphttp/tempo:
    endpoint: "http://tempo:4318"
    tls:
      insecure: true

  # Loki — log backend for Grafana log panels
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    default_labels_enabled:
      exporter: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, transform/add_resource]
      exporters: [prometheus]

    traces:
      receivers: [otlp]
      processors: [batch, transform/add_resource]
      exporters: [otlphttp/tempo]

    logs:
      receivers: [otlp]
      processors: [batch, transform/add_resource]
      exporters: [loki]