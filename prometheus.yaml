global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector'
  - job_name: 'graphos'
    static_configs:
      - targets: ['host.docker.internal:9090']
        labels:
          service: 'graphos'
