name: Graphos Repo Analyzer

on:
  workflow_dispatch:
    inputs:
      repo_urls:
        description: 'Comma-separated list of GitHub repo URLs to analyze'
        required: true
        default: 'https://github.com/Effect-TS/core,https://github.com/Effect-TS/cli'
      graphos_version:
        description: 'Graphos version tag (e.g., v0.1.0) or "latest"'
        required: false
        default: 'latest'
      deep_mode:
        description: 'Enable deep extraction mode'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.split.outputs.repos }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Split repo list into JSON array
        id: split
        env:
          REPO_URLS: ${{ inputs.repo_urls }}
        run: |
          REPOS=$(printf '%s' "$REPO_URLS" | jq -Rsc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"
          echo "Matrix: $REPOS"

      - name: Resolve graphos version
        id: version
        env:
          REQUESTED: ${{ inputs.graphos_version }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "latest" ]; then
            TAG=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty' || true)
            if [ -z "$TAG" ]; then
              echo "No releases found; will build from source"
            else
              echo "Latest release: $TAG"
            fi
          else
            TAG="$REQUESTED"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  analyze:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.repos) }}
    env:
      REPO_URL: ${{ matrix.repo }}
      GRAPHOS_TAG: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Graphos (for source build fallback)
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Get graphos binary
        run: |
          if [ -n "$GRAPHOS_TAG" ]; then
            echo "Trying prebuilt binary for $GRAPHOS_TAG"
            if curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$GRAPHOS_TAG/graphos-linux-x86_64" -o graphos; then
              chmod +x graphos
              echo "Downloaded prebuilt binary $GRAPHOS_TAG"
              exit 0
            fi
            echo "Prebuilt binary download failed; falling back to source build"
          else
            echo "No release available; building from source"
          fi
          devenv tasks run ci:build
          GRAPHOS_BIN=$(devenv shell -- cabal list-bin graphos)
          cp "$GRAPHOS_BIN" graphos
          chmod +x graphos

      - name: Clone target repo
        run: |
          REPO_NAME=$(basename "$REPO_URL" .git)
          git clone --depth 1 "$REPO_URL" "$REPO_NAME"
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"
          echo "Cloned $REPO_URL as $REPO_NAME"

      - name: Run graphos + measure time & memory
        env:
          DEEP: ${{ inputs.deep_mode }}
        run: |
          OUTPUT_DIR="graphos-out-$REPO_NAME"
          mkdir -p "$OUTPUT_DIR"

          DEEP_FLAG=""
          if [ "$DEEP" = "true" ]; then DEEP_FLAG="--deep"; fi

          /usr/bin/time -v -o "${OUTPUT_DIR}/time-memory.txt" \
            ./graphos "$REPO_NAME" \
            -o "$OUTPUT_DIR" \
            --no-viz $DEEP_FLAG

          echo "Results in $OUTPUT_DIR/"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphos-results-${{ github.run_number }}-${{ env.REPO_NAME }}
          path: graphos-out-*/
          if-no-files-found: ignore

      - name: Output metrics
        if: always()
        run: |
          OUTPUT_DIR="graphos-out-$REPO_NAME"
          {
            echo "## Graphos Analysis Results"
            echo ""
            echo "### $REPO_NAME"
            echo ""
            if [ -f "$OUTPUT_DIR/time-memory.txt" ]; then
              echo "**Execution Time:** $(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' "$OUTPUT_DIR/time-memory.txt")"
              echo "**Max Resident Memory:** $(awk -F': ' '/Maximum resident/ {print $2}' "$OUTPUT_DIR/time-memory.txt") KB"
            else
              echo "**Execution Time:** n/a (graphos failed)"
              echo "**Max Resident Memory:** n/a (graphos failed)"
            fi
            echo ""
            if [ -f "$OUTPUT_DIR/graph.json" ]; then
              echo "**Graph nodes:** $(jq '(.nodes // []) | length' "$OUTPUT_DIR/graph.json")"
              echo "**Graph edges:** $(jq '(.edges // []) | length' "$OUTPUT_DIR/graph.json")"
              echo "**Communities:** $(jq '(.communities // {}) | length' "$OUTPUT_DIR/graph.json")"
            else
              echo "**Graph:** no graph.json produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"