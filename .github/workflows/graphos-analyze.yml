name: Graphos Repo Analyzer

on:
  workflow_dispatch:
    inputs:
      repo_urls:
        description: 'Comma-separated list of GitHub repo URLs to analyze'
        required: true
        default: 'https://github.com/Effect-TS/core,https://github.com/Effect-TS/cli'
      graphos_version:
        description: 'Graphos version tag (e.g., v0.1.0) or "latest". Resolution order: matching/latest release asset → latest successful main CI artifact → source build'
        required: false
        default: 'latest'
      deep_mode:
        description: 'Enable deep extraction mode'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.split.outputs.repos }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Split repo list into JSON array
        id: split
        env:
          REPO_URLS: ${{ inputs.repo_urls }}
        run: |
          REPOS=$(printf '%s' "$REPO_URLS" | jq -Rsc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"
          echo "Matrix: $REPOS"

      - name: Resolve graphos version
        id: version
        env:
          REQUESTED: ${{ inputs.graphos_version }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "latest" ]; then
            TAG=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty' || true)
            if [ -z "$TAG" ]; then
              echo "No releases found; will build from source"
            else
              echo "Latest release: $TAG"
            fi
          else
            TAG="$REQUESTED"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  analyze:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.repos) }}
    env:
      REPO_URL: ${{ matrix.repo }}
      GRAPHOS_TAG: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout Graphos (for source build fallback)
        uses: actions/checkout@v4

      - name: Get graphos binary
        id: getbin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p dist/release

          # (1) Release asset matching the resolved tag
          if [ -n "$GRAPHOS_TAG" ]; then
            echo "Trying release asset for $GRAPHOS_TAG"
            if gh release download "$GRAPHOS_TAG" \
                 --repo "${{ github.repository }}" \
                 --pattern 'graphos-linux-x86_64' \
                 --output dist/release/graphos-linux-x86_64 \
                 --clobber; then
              chmod +x dist/release/graphos-linux-x86_64
              echo "Downloaded release asset $GRAPHOS_TAG"
              echo "found=release" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No release asset for $GRAPHOS_TAG; trying CI artifact"
          else
            echo "No release available; trying CI artifact"
          fi

          # (2) graphos-bin artifact of the latest successful main build
          RUN_ID=$(gh run list --repo "${{ github.repository }}" \
                     --workflow haskell.yml --branch main --status success \
                     --limit 20 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            if gh run download "$RUN_ID" --repo "${{ github.repository }}" \
                 --name graphos-bin --output dist/release/; then
              chmod +x dist/release/graphos-linux-x86_64
              echo "Downloaded CI artifact from run $RUN_ID"
              echo "found=artifact" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No graphos-bin artifact on run $RUN_ID; falling back to source build"
          else
            echo "No successful main CI run found; falling back to source build"
          fi

          echo "found=" >> "$GITHUB_OUTPUT"

      - name: Setup Nix
        if: steps.getbin.outputs.found == ''
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        if: steps.getbin.outputs.found == ''
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        if: steps.getbin.outputs.found == ''
        run: nix profile add nixpkgs#devenv

      - name: Restore cabal store cache (source build fallback)
        if: steps.getbin.outputs.found == ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/state/cabal/store
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project') }}-
            cabal-${{ runner.os }}-ghc910-

      - name: Build from source (fallback)
        if: steps.getbin.outputs.found == ''
        run: |
          devenv tasks run ci:build
          devenv tasks run ci:bin
          BIN_PATH=$(devenv shell -- cabal list-bin graphos)
          cp "$BIN_PATH" dist/release/graphos-linux-x86_64
          chmod +x dist/release/graphos-linux-x86_64

      - name: Verify binary
        run: |
          test -f dist/release/graphos-linux-x86_64 || { echo "graphos binary missing after acquisition" >&2; exit 1; }
          test -x dist/release/graphos-linux-x86_64 || { echo "graphos binary is not executable" >&2; exit 1; }
          ./dist/release/graphos-linux-x86_64 --help >/dev/null 2>&1 || true
          echo "Using binary: $(ls -l dist/release/graphos-linux-x86_64 | awk '{print $5}') bytes"

      - name: Clone target repo
        run: |
          REPO_NAME=$(basename "$REPO_URL" .git)
          git clone --depth 1 "$REPO_URL" "$REPO_NAME"
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"
          echo "Cloned $REPO_URL as $REPO_NAME"

      - name: Run graphos + measure time & memory
        env:
          DEEP: ${{ inputs.deep_mode }}
        run: |
          OUTPUT_DIR="graphos-out-$REPO_NAME"
          mkdir -p "$OUTPUT_DIR"

          DEEP_FLAG=""
          if [ "$DEEP" = "true" ]; then DEEP_FLAG="--deep"; fi

          /usr/bin/time -v -o "${OUTPUT_DIR}/time-memory.txt" \
            ./dist/release/graphos-linux-x86_64 "$REPO_NAME" \
            -o "$OUTPUT_DIR" \
            --no-viz $DEEP_FLAG

          echo "Results in $OUTPUT_DIR/"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphos-results-${{ github.run_number }}-${{ env.REPO_NAME }}
          path: graphos-out-*/
          if-no-files-found: ignore

      - name: Output metrics
        if: always()
        run: |
          OUTPUT_DIR="graphos-out-$REPO_NAME"
          {
            echo "## Graphos Analysis Results"
            echo ""
            echo "### $REPO_NAME"
            echo ""
            if [ -f "$OUTPUT_DIR/time-memory.txt" ]; then
              echo "**Execution Time:** $(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' "$OUTPUT_DIR/time-memory.txt")"
              echo "**Max Resident Memory:** $(awk -F': ' '/Maximum resident/ {print $2}' "$OUTPUT_DIR/time-memory.txt") KB"
            else
              echo "**Execution Time:** n/a (graphos failed)"
              echo "**Max Resident Memory:** n/a (graphos failed)"
            fi
            echo ""
            if [ -f "$OUTPUT_DIR/graph.json" ]; then
              echo "**Graph nodes:** $(jq '(.nodes // []) | length' "$OUTPUT_DIR/graph.json")"
              echo "**Graph edges:** $(jq '(.edges // []) | length' "$OUTPUT_DIR/graph.json")"
              echo "**Communities:** $(jq '(.communities // {}) | length' "$OUTPUT_DIR/graph.json")"
            else
              echo "**Graph:** no graph.json produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"