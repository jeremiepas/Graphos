name: Haskell CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.actor == 'jeremiepas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Build
        run: devenv tasks run ci:build

      - name: Run tests
        run: devenv tasks run ci:test

      - name: Install OpenSpec CLI
        run: npm install -g openspec

      - name: Validate OpenSpec changes
        continue-on-error: true
        run: openspec validate --changes --json

  haddock:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.actor == 'jeremiepas'
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Haddock
        run: devenv tasks run ci:haddock