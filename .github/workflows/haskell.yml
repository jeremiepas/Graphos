name: Haskell CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.actor == 'jeremiepas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Restore cabal store cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/state/cabal/store
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project') }}-
            cabal-${{ runner.os }}-ghc910-

      - name: Build
        run: devenv tasks run ci:build

      - name: Run tests
        run: devenv tasks run ci:test

      - name: Save binary artifact
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p dist/release
          BIN_PATH=$(devenv shell -- cabal list-bin graphos)
          cp "$BIN_PATH" dist/release/graphos-linux-x86_64
          chmod +x dist/release/graphos-linux-x86_64

      - name: Upload binary artifact
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: graphos-bin
          path: dist/release/graphos-linux-x86_64
          retention-days: 14

      - name: Install OpenSpec CLI
        run: npm install -g openspec

      - name: Validate OpenSpec changes
        continue-on-error: true
        run: openspec validate --changes --json

  haddock:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.actor == 'jeremiepas'
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Restore cabal store cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/state/cabal/store
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project') }}-
            cabal-${{ runner.os }}-ghc910-

      - name: Haddock
        run: devenv tasks run ci:haddock