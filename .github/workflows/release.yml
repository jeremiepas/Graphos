name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.actor == 'jeremiepas'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31

    - uses: cachix/cachix-action@v16
      with:
        name: devenv

    - name: Install devenv.sh
      run: nix profile add nixpkgs#devenv

    - name: Build
      run: devenv tasks run ci:release-build

    - name: Run tests
      run: devenv tasks run ci:release-test

    - name: Generate SHA256 checksums
      run: |
        mkdir -p dist/release
        BIN_PATH=$(devenv shell -- cabal list-bin graphos)
        cp "$BIN_PATH" dist/release/graphos-linux-x86_64
        cd dist/release
        sha256sum graphos-linux-x86_64 > graphos-linux-x86_64.sha256

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Graphos ${{ github.ref_name }}
        body: |
          ## Graphos ${{ github.ref_name }}

          **Changes**: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

          ### Assets
          | File | Description |
          |------|-------------|
          | `graphos-linux-x86_64` | Static Linux binary (x86_64) |
          | `graphos-linux-x86_64.sha256` | SHA256 checksum |
        files: |
          dist/release/graphos-linux-x86_64
          dist/release/graphos-linux-x86_64.sha256
        draft: false
        prerelease: false