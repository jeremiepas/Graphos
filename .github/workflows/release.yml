name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.actor == 'jeremiepas'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # AVI-1488: third-party action in a `contents: write` job — pin to SHA.
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: devenv

    - name: Install devenv.sh
      run: nix profile add nixpkgs#devenv

    - name: Restore cabal store cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/state/cabal/store
          ~/.cabal/store
        key: cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project', 'devenv.nix') }}
        restore-keys: |
          cabal-${{ runner.os }}-ghc910-${{ hashFiles('graphos.cabal', 'cabal.project', 'devenv.nix') }}-
          cabal-${{ runner.os }}-ghc910-

    - name: Build
      run: devenv tasks run ci:release-build

    - name: Run tests
      run: devenv tasks run ci:release-test

    - name: Generate SHA256 checksums
      run: |
        mkdir -p dist/release
        BIN_PATH=$(devenv shell -- cabal list-bin graphos 2>/dev/null | grep -E '^/' | tail -n 1)
        cp "$BIN_PATH" dist/release/graphos-linux-x86_64
        cd dist/release
        sha256sum graphos-linux-x86_64 > graphos-linux-x86_64.sha256

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ github.ref_name }}
        name: Graphos ${{ github.ref_name }}
        body: |
          ## Graphos ${{ github.ref_name }}

          **Changes**: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

          ### Assets
          | File | Description |
          |------|-------------|
          | `graphos-linux-x86_64` | Static Linux binary (x86_64) |
          | `graphos-linux-x86_64.sha256` | SHA256 checksum |
        files: |
          dist/release/graphos-linux-x86_64
          dist/release/graphos-linux-x86_64.sha256
        draft: false
        # Tags carrying "-rc." (e.g. v0.1.2-rc.1) publish as pre-releases;
        # stable tags (v0.1.2) keep publishing as full releases.
        prerelease: ${{ contains(github.ref_name, '-rc.') }}