# ───────────────────────────────────────────────
# Graphos Configuration
# ───────────────────────────────────────────────
# This file configures LSP servers and file extension categories.
# Any field left out will fall back to built-in defaults.
# User values override defaults (for LSP/language_ids maps).
#
# Config resolution (later wins):
#   1. Built-in defaults
#   2. Global config: ~/.config/graphos/graphos.yaml
#   3. This file (project graphos.yaml)
#   4. CLI flags (--otel, --metrics, etc.)

# ──── LSP Servers ─────────────────────────────
# Map file extension → {command, args, language_id}
# Set command to "" to explicitly disable an extension's LSP.
# Unlisted extensions use defaults from Graphos.Domain.Config.
lsp:
  ".nix":
    command: ""
    args: []
    language_id: nix
  ".json":
    command: vscode-json-language-server
    args: ["--stdio"]
    language_id: json
  ".hs":
    command: haskell-language-server
    args: ["--lsp"]
    language_id: haskell
  ".py":
    command: pyright-langserver
    args: ["--stdio"]
    language_id: python
  ".ts":
    command: typescript-language-server
    args: ["--stdio"]
    language_id: typescript
  ".tsx":
    command: typescript-language-server
    args: ["--stdio"]
    language_id: typescriptreact
  ".js":
    command: typescript-language-server
    args: ["--stdio"]
    language_id: javascript
  ".go":
    command: gopls
    args: []
    language_id: go
  ".rs":
    command: rust-analyzer
    args: []
    language_id: rust
  ".c":
    command: clangd
    args: []
    language_id: c
  ".cpp":
    command: clangd
    args: []
    language_id: cpp
  # Disable LSP for .text files (no server available)
  ".text":
    command: ""
    args: []
    language_id: plaintext
  # RAML — no LSP available, treat as document
  ".raml":
    command: ""
    args: []
    language_id: raml

# ──── Language IDs ─────────────────────────────
# Override or add language IDs for file extensions.
# Unlisted extensions use defaults.
language_ids:
  ".nix": nix
  ".json": json
  ".text": plaintext
  ".raml": raml

# ──── File Extension Categories ────────────────
# Full override for each category (replaces defaults).
# If you only want to ADD extensions, copy the defaults here and append.
file_extensions:
  code:
    - .py
    - .ts
    - .tsx
    - .js
    - .jsx
    - .go
    - .rs
    - .java
    - .c
    - .cpp
    - .h
    - .hpp
    - .rb
    - .cs
    - .kt
    - .kts
    - .scala
    - .php
    - .swift
    - .lua
    - .zig
    - .hs
    - .lhs
    - .ex
    - .exs
    - .m
    - .mm
    - .jl
    - .vue
    - .svelte
    - .dart
    - .ps1
    - .nix # NEW: Nix expressions
    - .json # NEW: JSON documents (symbols via LSP)
  doc:
    - .md
    - .txt
    - .rst
    - .adoc
    - .org
    - .text # NEW: plain text documents
    - .raml # NEW: RAML API specs (treated as docs)
  paper:
    - .pdf
  image:
    - .png
    - .jpg
    - .jpeg
    - .webp
    - .gif
  video:
    - .mp4
    - .mov
    - .mkv
    - .webm
    - .avi
    - .m4v
    - .mp3
    - .wav
    - .m4a
    - .ogg
  office:
    - .docx
    - .pptx
    - .xlsx
    - .doc
    - .ppt

# ──── Observability ─────────────────────────────
# Enable tracing, metrics, and debug instrumentation.
# CLI flags (--otel, --metrics, --debug-trace) override these values.
# Use --no-observability to completely disable all observability (no tracing,
# metrics, or log shipping) to avoid shutdown delays and reduce overhead.
observability:
  # Enable OpenTelemetry trace/metric export to an OTLP collector
  enabled: false
  # OTLP endpoint base URL (v1/traces and v1/metrics are appended automatically)
  endpoint: "http://localhost:14319"
  # Prometheus metrics server port (0 = disabled; use --metrics PORT to override)
  metricsPort: 0
  # Service name and version attached to all spans and metrics
  serviceName: graphos
  serviceVersion: "0.1.0"
  # Metrics export interval in seconds
  exportInterval: 15
  # Directory for debug trace JSONL files (empty = disabled, use --debug-trace to enable)
  debugTraceDir: ""

# ──── Neo4j ──────────────────────────────────────
# Used by: graphos . --neo4j --neo4j-push
neo4j:
  uri: "http://localhost:7474"
  user: "neo4j"
  password: "graphos_dev"
  push_mode: "subgraph"
  subgraph_size: 7

# ──── Memgraph ────────────────────────────────────
# In-memory graph database, Bolt-protocol compatible.
# Used by: graphos . --memgraph --memgraph-push bolt://localhost:7688
# No auth by default — leave user/password empty for local dev.
memgraph:
  uri: "bolt://localhost:7688"
  user: ""
  password: ""
  push_mode: "subgraph"
  subgraph_size: 7

# ──── LLM Labeling ────────────────────────────────
# Community labeling via Ollama (local, free).
# Used by: graphos . --label
labeling:
  provider: "ollama"
  model: "llama3.2"
  apiKey: ""
  baseUrl: "http://localhost:11434/v1"
  batchSize: 20

# ──── Vision ──────────────────────────────────────
# Multimodal LLM configuration for image analysis.
# Disabled by default — enable with --vision flag or vision.enabled: true.
# Supports OpenAI-compatible APIs (OpenAI, Ollama, LiteLLM).
# When apiKey/baseUrl are not set, they inherit from labeling config.
vision:
  enabled: false
  model: "qwen3.6-moe"
  # apiKey: "${OPENAI_API_KEY}"  # inherits from labeling if not set
  # baseUrl: "http://localhost:11434/v1"  # inherits from labeling if not set
  maxTokens: 1000
  batchSize: 5
